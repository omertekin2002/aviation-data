name: Update Stock Data & Deploy

on:
  schedule:
    # Runs every 30 minutes, every day.
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Data commits never overlap. This group is released as soon as the job
    # finishes, so a slow or stuck deploy cannot hold up later updates.
    concurrency:
      group: update-stock-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data dependencies
        run: python -m pip install --upgrade yfinance

      - name: Fetch stock data from Yahoo Finance
        run: python scripts/update_data.py

      - name: Check the data contract
        run: python scripts/validate_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --staged --quiet; then
            git commit -m "Update aviation stock data"
            git pull --rebase origin main
            git push
          else
            echo "No stock-data changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    # Every deploy ships the whole site, so a newer deploy replaces a stuck or
    # older one instead of queueing behind it.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
